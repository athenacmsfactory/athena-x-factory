name: 🔬 Athena Engine CI

on:
  push:
    branches: [main]
    paths:
      - 'factory/**'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    paths:
      - 'factory/**'
      - '.github/workflows/engine-ci.yml'
  workflow_dispatch:

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory
    steps:
      - name: 🛰️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: factory/pnpm-lock.yaml

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run engine tests + E2E (blueprint -> site -> vite build)
        run: pnpm test
